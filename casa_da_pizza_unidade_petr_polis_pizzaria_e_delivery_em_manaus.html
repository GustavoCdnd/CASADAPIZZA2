                    aria-label="WhatsApp"
                    className="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200/80 text-xs font-semibold transition-colors"
                  >
                    <Icon name="message-circle" className="w-4 h-4 text-emerald-600" />
                    <span>WhatsApp</span>
                  </a>

                  <a
                    href="https://www.instagram.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                    className="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-slate-50 hover:bg-pink-50 text-slate-700 hover:text-pink-700 border border-slate-200/80 text-xs font-semibold transition-colors"
                  >
                    <Icon name="instagram" className="w-4 h-4 text-pink-600" />
                    <span>Instagram</span>
                  </a>

                  <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Facebook"
                    className="inline-flex items-center gap-2 px-3.5 py-2 rounded-full bg-slate-50 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200/80 text-xs font-semibold transition-colors"
                  >
                    <Icon name="facebook" className="w-4 h-4 text-blue-600" />
                    <span>Facebook</span>
                  </a>

                  <button
                    onClick={() => setSeoModalOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-slate-50 hover:bg-amber-50 text-slate-500 hover:text-brand-brown border border-slate-200/80 text-xs font-semibold transition-colors"
                  >
                    <Icon name="search" className="w-3.5 h-3.5" />
                    <span>SEO Google</span>
                  </button>
                </div>
              </div>

              <div className="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-2">
                <p>© {new Date().getFullYear()} Casa da Pizza — Unidade Petrópolis. "Deus é fiel".</p>
                <a
                  href={SAIPOS_URL}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-brand-brown hover:text-brand-red font-semibold transition-colors"
                >
                  Cardápio Oficial Saipos →
                </a>
              </div>
            </div>
          </footer>

          {/* BOTÃO FLUTUANTE DISCRETO NO CANTO INFERIOR DIREITO */}
          <div className="fixed bottom-5 right-5 z-40">
            <a
              href={SAIPOS_URL}
              target="_blank"
              rel="noopener noreferrer"
              className="flex items-center gap-2.5 bg-brand-red hover:bg-brand-redDark text-white font-bold text-sm px-5 py-3.5 rounded-full shadow-lg shadow-red-600/25 hover:scale-105 transition-all"
            >
              <Icon name="shopping-bag" className="w-4 h-4" />
              <span>Pedir Online</span>
            </a>
          </div>

          {/* MODAL DE TAGS SEO GOOGLE */}
          {seoModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 border border-slate-200 shadow-2xl">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900 text-base">
                    Tags de Indexação no Google (SEO Local)
                  </h3>
                  <button
                    onClick={() => setSeoModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 p-1"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <p className="text-xs text-slate-600 mt-3 leading-relaxed">
                  Estas tags e os dados estruturados <code className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-800">Schema.org/PizzaRestaurant</code> já estão incluídos no código da página para facilitar a busca no Google por <strong>Casa da Pizza Petrópolis Manaus</strong>:
                </p>
                <pre className="mt-3 p-3.5 rounded-xl bg-slate-900 text-slate-100 text-[11px] overflow-x-auto leading-relaxed">
                  {seoSnippet}
                </pre>
                <div className="mt-4 flex justify-end gap-2">
                  <button
                    onClick={copySeo}
                    className="inline-flex items-center gap-1.5 bg-brand-red text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-brand-redDark transition-colors"
                  >
                    <Icon name={copiedSeo ? "check" : "copy"} className="w-3.5 h-3.5" />
                    <span>{copiedSeo ? "Copiado!" : "Copiar Tags"}</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
